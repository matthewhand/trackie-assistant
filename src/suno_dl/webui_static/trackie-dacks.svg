<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" role="img" aria-labelledby="trackie-title trackie-desc">
<title id="trackie-title">Trackie Dacks</title><desc id="trackie-desc">Cheeky teal track pants mascot in headphones with gold music wave stripes and a thumbs-up.</desc>
<style>
.outline{stroke:#102c31;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.head{fill:#124a4a}.shade{fill:#0d393d}.light{fill:#24716c}.gold{fill:#f4ac39}.cream{fill:#fff4df}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes thumbs{0%,100%{transform:rotate(0deg)}50%{transform:rotate(9deg)}}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.12)}}
#trackie-body{transform-origin:78px 100px;animation:sway 3.8s ease-in-out infinite}
#right-arm{transform-origin:117px 85px;animation:thumbs 3.8s ease-in-out infinite}
#eye-left,#eye-right{transform-box:fill-box;transform-origin:center;animation:blink 6s ease-in-out infinite}
.wave{animation:pulse 1.5s ease-in-out infinite}
.wave + .wave{animation-delay:.4s}
@media(prefers-reduced-motion:reduce){#trackie-body,#right-arm,#eye-left,#eye-right,.wave{animation:none!important}}
</style>
<circle cx="81" cy="89" r="67" fill="#f8ca70" opacity=".8"/>
