<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From page payload to file on disk</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 3rem 2rem; }
    .frame { max-width: 1120px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
                letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted);
                margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
          font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · Track lifecycle</p>
    <h1>From page payload to file on disk</h1>
    <svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dataflow-title dataflow-desc">
      <title id="dataflow-title">From page payload to file on disk</title>
      <desc id="dataflow-desc">A track moves through four transformations: the RSC payload becomes TrackInfo objects, media URLs are resolved and host-checked, a filename is derived and sanitised, and the streamed bytes are written atomically to the output directory. Nothing untrusted reaches the filesystem unfiltered.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <path d="M 200,210 H 216 Q 224,210 224,202 V 172 Q 224,180 232,180 H 248" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 408,210 H 424 Q 432,210 432,202 V 172 Q 432,180 440,180 H 456" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 616,210 H 632 Q 640,210 640,202 V 172 Q 640,180 648,180 H 664" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 824,210 H 840 Q 848,210 848,218 V 152 Q 848,144 856,144 H 872" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M 536,240 V 288 Q 536,296 544,296 H 528 Q 536,296 536,304 V 320" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M 744,240 V 288 Q 744,296 752,296 H 736 Q 744,296 744,304 V 320" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="232" y="185" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="254" y="194" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PARSE</text>
      <rect x="440" y="185" width="54" height="12" rx="2" fill="#f5f5f5"/><text x="467" y="194" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESOLVE</text>
      <rect x="648" y="185" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="672" y="194" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DERIVE</text>
      <rect x="856" y="175" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="878" y="184" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WRITE</text>
      <rect x="40" y="180" width="160" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="180" width="160" height="60" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="120" y="207" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RSC payload</text>
      <text x="120" y="223" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">untrusted text</text>
      <rect x="248" y="180" width="160" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="180" width="160" height="60" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="328" y="207" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TrackInfo</text>
      <text x="328" y="223" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">id · title · urls</text>
      <rect x="456" y="180" width="160" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="456" y="180" width="160" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="536" y="207" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Media URLs</text>
      <text x="536" y="223" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">allow-listed</text>
      <rect x="664" y="180" width="160" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="664" y="180" width="160" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="744" y="207" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Filename</text>
      <text x="744" y="223" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sanitised</text>
      <rect x="872" y="84" width="160" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="872" y="84" width="160" height="60" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="952" y="111" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">File on disk</text>
      <text x="952" y="127" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">name + ext</text>
      <rect x="456" y="320" width="160" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="456" y="320" width="160" height="60" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="536" y="347" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Discarded</text>
      <text x="536" y="363" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">non-allow-listed</text>
      <rect x="664" y="320" width="160" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="664" y="320" width="160" height="60" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="744" y="347" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">.part temp</text>
      <text x="744" y="363" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">atomic rename</text>
      <line x1="32" y1="424" x2="968" y2="424" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="128" y="432" width="10" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="144" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">EXTERNAL</text>
      <rect x="224" y="432" width="10" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="240" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">FOCAL</text>
      <rect x="302" y="432" width="10" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="318" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">MODULE</text>
      <rect x="386" y="432" width="10" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="402" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">STORE</text>
      <line x1="464" y1="437" x2="488" y2="437" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="496" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">LOCAL CALL</text>
      <line x1="588" y1="437" x2="612" y2="437" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="620" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">PRIMARY</text>
      <rect x="694" y="432" width="10" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="710" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ASYNC</text>
    </svg>
  </div>
</body>
</html>
