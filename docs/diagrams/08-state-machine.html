<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Per-track download outcomes</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 3rem 2rem; }
    .frame { max-width: 1120px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
                letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted);
                margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
          font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Behaviour · State machine</p>
    <h1>Per-track download outcomes</h1>
    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="state-title state-desc">
      <title id="state-title">Per-track download outcomes</title>
      <desc id="state-desc">Each track starts a download attempt and ends in one of three terminal states: downloaded, skipped because an existing file was found, or failed after every candidate URL was rejected.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <path d="M 96,142 H 128 Q 136,142 136,150 V 142 Q 136,150 144,150 H 176" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 376,150 H 430 Q 438,150 438,142 V 88 Q 438,80 446,80 H 500" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M 376,150 H 430 Q 438,150 438,158 V 200 Q 438,208 446,208 H 500" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 376,150 H 430 Q 438,150 438,158 V 328 Q 438,336 446,336 H 500" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="114" y="132" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="136" y="141" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">begin</text>
      <rect x="414" y="101" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="438" y="110" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">accept</text><rect x="416" y="115" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="438" y="124" fill="#9aa3b2" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">[200]</text>
      <rect x="414" y="165" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="438" y="174" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">exists</text><rect x="390" y="179" width="96" height="12" rx="2" fill="#f5f5f5"/><text x="438" y="188" fill="#9aa3b2" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">[file present]</text>
      <rect x="411" y="229" width="54" height="12" rx="2" fill="#f5f5f5"/><text x="438" y="238" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">exhaust</text><rect x="405" y="243" width="66" height="12" rx="2" fill="#f5f5f5"/><text x="438" y="252" fill="#9aa3b2" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">[403/404]</text>
      <circle cx="84" cy="142" r="10" fill="#2d3142"/>
      <rect x="176" y="118" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="176" y="118" width="200" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="276" y="147" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">attempt</text>
      <text x="276" y="163" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">candidate loop</text>
      <rect x="500" y="48" width="208" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="500" y="48" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="604" y="77" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">downloaded</text>
      <text x="604" y="93" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bytes &gt;= 1 KiB</text>
      <rect x="500" y="176" width="208" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="500" y="176" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="604" y="205" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">skipped_exists</text>
      <text x="604" y="221" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">file already present</text>
      <rect x="500" y="304" width="208" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="500" y="304" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="604" y="333" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">failed</text>
      <text x="604" y="349" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no media available</text>
      <line x1="32" y1="450" x2="968" y2="450" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="466" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="112" y1="462" x2="136" y2="462" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="144" y="466" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">TRANSITION</text>
      <line x1="236" y1="462" x2="260" y2="462" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="268" y="466" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">SUCCESS</text>
      <line x1="342" y1="462" x2="366" y2="462" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"/>
      <text x="374" y="466" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">DISCARD</text>
    </svg>
  </div>
</body>
</html>
