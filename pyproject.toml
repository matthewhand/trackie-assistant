[project]
name = "trackie-assistant"
version = "1.6.2rc2"
description = "Trackie Assistant: archive public Suno music from profiles, playlists or songs"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["suno", "music", "download", "archival", "cli", "ai-music"]
authors = [{name = "Matthew Hand", email = "11550632+matthewhand@users.noreply.github.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
]
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "pydantic>=2.7.0",
    "tqdm>=4.66.0",
]

[project.urls]
Homepage = "https://github.com/matthewhand/trackie-assistant"
Repository = "https://github.com/matthewhand/trackie-assistant"
Issues = "https://github.com/matthewhand/trackie-assistant/issues"
Changelog = "https://github.com/matthewhand/trackie-assistant/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Browser fallback is optional: HTTP feed/song/playlist use does not need Chromium.
browser = [
    "playwright>=1.42.0",
]
# Optional, justified: --covers recompresses downloaded cover art (JPEGs) so
# archival runs use less disk. Pillow is imported lazily; without it, covers
# are saved as-served (byte-identical), never an error.
image = [
    "Pillow>=10.0.0",
]
# Optional, justified: embedded artist/title tags use a staged Mutagen copy.
# FFmpeg tagging fallback is disabled until lossless preservation is verified.
# Without Mutagen the file is still saved, just untagged.
tags = [
    "mutagen>=1.47.0",
]
dev = [
    # Release provenance: scripts/release_manifest.py builds a pinned wheel.
    "build>=1.2.0",
    "setuptools>=68.0",
    "wheel>=0.43",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest-cov>=5.0.0",
    "mutagen>=1.47.0",
    # Browser APIs are mocked by the discovery regression tests.
    "playwright>=1.42.0",
]

[project.scripts]
suno-verified-sync = "suno_dl.verified_sync:main"
suno-dl = "suno_dl.cli:main"
suno-recommend = "suno_dl.recommend:recommend_cli"
suno-webui = "suno_dl.webui:webui_cli"
suno-producer-evidence = "suno_dl.producer_evidence:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
suno_dl = [
    "py.typed",
    "data/*.json",
    "webui_static/*.js",
    "webui_static/*.svg",
    "webui_static/*.webp",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "C4"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"research_checks/*" = ["S101"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["suno_dl"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
fail_under = 70

