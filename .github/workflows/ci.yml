name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # This preview qualifies Linux archive writes only.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install Chromium for the browser (Playwright) tests
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          python -m playwright install --with-deps chromium
          echo "SUNO_REQUIRE_BROWSER=1" >> "$GITHUB_ENV"
      - name: Lint
        run: ruff check src tests
      - name: Format check
        run: ruff format --check src tests
      - name: Typecheck
        run: mypy src
      - name: Test
        run: pytest -q --cov=suno_dl --cov-report=term-missing --cov-fail-under=70

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel + smoke test
        run: |
          pip install dist/*.whl
          suno-dl --version
          suno-dl --help
          python -c "import suno_dl; print(suno_dl.__version__)"
