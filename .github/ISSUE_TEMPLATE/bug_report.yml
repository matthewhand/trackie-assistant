name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please redact any `sig=` query parameters from logs
        before pasting (the tool redacts them in its own output, but copy/paste may not).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command run
      description: The exact command, with any private handle redacted.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output / logs
      description: Full output, including the summary line. Use `-v` for debug logs.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `suno-dl --version`.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: "3.13.x on Ubuntu 24.04"
    validations:
      required: true
